<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>星期英文單字拼字大挑戰</title>
  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #e0f2fe 0%, #fef9c3 100%);
      --card-bg: #ffffff;
      --primary: #0284c7;
      --primary-dark: #0369a1;
      --accent: #f59e0b;
      --success: #16a34a;
      --danger: #dc2626;
      --text-main: #1e293b;
      --text-muted: #64748b;
      --key-bg: #f8fafc;
      --key-border: #cbd5e1;
      --key-shadow: #94a3b8;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      overflow-x: hidden;
      overscroll-behavior-y: none;
      background: var(--bg-gradient);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans TC", sans-serif;
      color: var(--text-main);
    }

    body {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 12px 10px 24px;
      min-height: 100%;
    }

    .app-container {
      width: 100%;
      max-width: 720px;
      background: var(--card-bg);
      border-radius: 24px;
      box-shadow: 0 10px 25px rgba(15, 23, 42, 0.08);
      padding: 16px 18px 20px;
      border: 2px solid #e2e8f0;
    }

    /* 頂部狀態列 */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 6px;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }

    .badge-group {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .badge {
      background: #f1f5f9;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--text-main);
      display: inline-flex;
      align-items: center;
      gap: 4px;
      height: 32px;
    }

    .badge.timer {
      background: #fef3c7;
      color: #b45309;
      font-variant-numeric: tabular-nums;
      min-width: 92px;
      justify-content: center;
    }

    .badge.pb-badge {
      background: #ede9fe;
      color: #6d28d9;
      font-variant-numeric: tabular-nums;
    }

    .badge.cloud-status {
      font-size: 0.78rem;
      padding: 4px 9px;
      height: 30px;
    }

    .badge.cloud-online {
      background: #dcfce7;
      color: #15803d;
    }

    .badge.cloud-local {
      background: #f1f5f9;
      color: #475569;
    }

    .action-group {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .btn-restart-top {
      background: #f1f5f9;
      border: 1.5px solid #cbd5e1;
      color: #334155;
      font-weight: 700;
      font-size: 0.85rem;
      padding: 0 11px;
      height: 32px;
      border-radius: 999px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 3px;
    }

    .btn-restart-top:active {
      transform: scale(0.95);
      background: #e2e8f0;
    }

    .btn-leaderboard {
      background: #fef08a;
      border: 2px solid #eab308;
      color: #854d0e;
      font-weight: 800;
      font-size: 0.85rem;
      padding: 0 12px;
      height: 32px;
      border-radius: 999px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      transition: transform 0.1s;
    }

    .btn-leaderboard:active {
      transform: scale(0.96);
    }

    /* 進度條 */
    .progress-track {
      width: 100%;
      height: 10px;
      background: #e2e8f0;
      border-radius: 999px;
      overflow: hidden;
      margin-bottom: 14px;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #38bdf8, #0284c7);
      transition: width 0.3s ease;
    }

    /* 題目展示區 */
    .question-box {
      text-align: center;
      background: #f8fafc;
      border: 2px dashed #cbd5e1;
      border-radius: 18px;
      padding: 14px 12px;
      margin-bottom: 14px;
    }

    .question-label {
      font-size: 0.85rem;
      color: var(--text-muted);
      font-weight: 600;
      margin-bottom: 4px;
    }

    .chinese-word-row {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 12px;
    }

    .chinese-word {
      font-size: 2.1rem;
      font-weight: 900;
      color: var(--primary-dark);
      letter-spacing: 2px;
      line-height: 1.2;
    }

    .btn-speak {
      background: #e0f2fe;
      border: 1.5px solid #7dd3fc;
      color: #0369a1;
      border-radius: 12px;
      padding: 6px 12px;
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      height: 36px;
    }

    .btn-speak:active {
      transform: scale(0.95);
    }

    /* 字母空格區 */
    .slots-wrapper {
      display: flex;
      justify-content: center;
      align-items: flex-end;
      gap: 6px;
      margin: 14px 0 8px;
      min-height: 68px;
      flex-wrap: wrap;
    }

    .slot-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
    }

    .cap-hint {
      font-size: 0.7rem;
      font-weight: 800;
      color: #d97706;
      background: #fef3c7;
      padding: 1px 6px;
      border-radius: 6px;
      height: 18px;
      line-height: 16px;
    }

    .cap-hint.empty {
      visibility: hidden;
    }

    .letter-slot {
      width: 40px;
      height: 46px;
      border-bottom: 4px solid #94a3b8;
      background: #f1f5f9;
      border-radius: 8px 8px 4px 4px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 1.65rem;
      font-weight: 800;
      color: var(--text-main);
      font-family: "Courier New", Courier, monospace;
      transition: all 0.15s ease;
    }

    .letter-slot.active {
      border-bottom-color: var(--primary);
      background: #e0f2fe;
    }

    .letter-slot.filled {
      border-bottom-color: var(--success);
      background: #dcfce7;
      color: #166534;
    }

    .letter-slot.error {
      border-bottom-color: var(--danger);
      background: #fee2e2;
      color: #991b1b;
    }

    /* 固定高度提示訊息列（防跳動關鍵） */
    .feedback-bar {
      height: 28px;
      line-height: 28px;
      text-align: center;
      font-size: 0.92rem;
      font-weight: 700;
      margin-bottom: 10px;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    .feedback-error {
      color: var(--danger);
    }

    .feedback-success {
      color: var(--success);
    }

    .feedback-info {
      color: var(--text-muted);
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-6px); }
      40%, 80% { transform: translateX(6px); }
    }

    .shake {
      animation: shake 0.32s ease-in-out;
    }

    /* 虛擬鍵盤區（固定尺寸防跳動） */
    .keyboard {
      display: flex;
      flex-direction: column;
      gap: 8px;
      background: #e2e8f0;
      padding: 10px 8px;
      border-radius: 16px;
    }

    .kb-row {
      display: flex;
      justify-content: center;
      gap: 5px;
      width: 100%;
    }

    .key-btn {
      flex: 1;
      max-width: 56px;
      height: 48px;
      line-height: 48px;
      padding: 0;
      border: 1px solid var(--key-border);
      border-bottom: 4px solid var(--key-shadow);
      border-radius: 10px;
      background: var(--key-bg);
      color: var(--text-main);
      font-size: 1.25rem;
      font-weight: 800;
      font-family: "Segoe UI", Roboto, sans-serif;
      text-align: center;
      cursor: pointer;
      touch-action: manipulation;
    }

    .key-btn:active {
      transform: translateY(2px);
      border-bottom-width: 2px;
      background: #e0f2fe;
    }

    .key-btn.shift-btn {
      flex: 1.6;
      max-width: 96px;
      font-size: 0.9rem;
      background: #f1f5f9;
      color: #334155;
    }

    .key-btn.shift-btn.is-upper {
      background: #fef08a;
      border-color: #eab308;
      border-bottom-color: #ca8a04;
      color: #854d0e;
    }

    /* 彈窗遮罩（過關畫面 & 排行榜） */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.6);
      display: none;
      justify-content: center;
      align-items: center;
      padding: 16px;
      z-index: 50;
    }

    .modal-overlay.show {
      display: flex;
    }

    .modal-card {
      background: #ffffff;
      width: 100%;
      max-width: 440px;
      border-radius: 24px;
      padding: 22px 20px;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.25);
      max-height: 90dvh;
      display: flex;
      flex-direction: column;
    }

    .trophy-icon {
      font-size: 3.2rem;
      line-height: 1;
      margin-bottom: 6px;
    }

    .modal-title {
      font-size: 1.45rem;
      font-weight: 900;
      color: var(--primary-dark);
      margin: 0 0 4px;
    }

    .final-time-box {
      background: #fef3c7;
      border: 2px solid #f59e0b;
      color: #b45309;
      font-size: 1.3rem;
      font-weight: 900;
      padding: 10px;
      border-radius: 14px;
      margin: 10px 0 6px;
    }

    .pb-compare-banner {
      font-size: 0.92rem;
      font-weight: 800;
      padding: 6px 10px;
      border-radius: 10px;
      margin-bottom: 8px;
    }

    .pb-new-record {
      background: #dcfce7;
      color: #15803d;
      border: 1.5px solid #86efac;
    }

    .pb-try-again {
      background: #f1f5f9;
      color: #475569;
    }

    .name-input-group {
      display: flex;
      gap: 8px;
      margin: 6px 0 10px;
    }

    /* 字體 16px 防止 iPad Safari 自動放大 */
    .name-input {
      flex: 1;
      height: 44px;
      padding: 0 12px;
      font-size: 16px;
      border: 2px solid #cbd5e1;
      border-radius: 12px;
      outline: none;
      user-select: text;
    }

    .name-input:focus {
      border-color: var(--primary);
    }

    .btn-primary {
      background: var(--primary);
      color: #ffffff;
      border: none;
      border-radius: 12px;
      height: 44px;
      padding: 0 16px;
      font-size: 0.98rem;
      font-weight: 800;
      cursor: pointer;
    }

    .btn-primary:disabled {
      background: #94a3b8;
      cursor: not-allowed;
    }

    .btn-success-action {
      background: #16a34a;
      color: #ffffff;
      border: none;
      border-radius: 12px;
      height: 44px;
      padding: 0 16px;
      font-size: 1rem;
      font-weight: 800;
      cursor: pointer;
    }

    .btn-secondary {
      background: #f1f5f9;
      color: #334155;
      border: 1.5px solid #cbd5e1;
      border-radius: 12px;
      height: 42px;
      padding: 0 18px;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      margin-top: 8px;
    }

    /* 排行榜列表 */
    .rank-list {
      flex: 1;
      overflow-y: auto;
      margin: 10px 0;
      border: 1.5px solid #e2e8f0;
      border-radius: 14px;
      padding: 6px;
      text-align: left;
      min-height: 160px;
    }

    .rank-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 12px;
      border-bottom: 1px solid #f1f5f9;
      font-weight: 700;
      font-size: 0.98rem;
    }

    .rank-row:last-child {
      border-bottom: none;
    }

    .rank-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .rank-medal {
      width: 28px;
      text-align: center;
      font-size: 1.1rem;
    }

    .rank-time {
      color: var(--primary-dark);
      font-variant-numeric: tabular-nums;
    }

    @media (max-width: 480px) {
      .letter-slot {
        width: 32px;
        height: 40px;
        font-size: 1.35rem;
      }
      .key-btn {
        height: 44px;
        line-height: 44px;
        font-size: 1.1rem;
      }
      .chinese-word {
        font-size: 1.8rem;
      }
    }
  </style>
</head>
<body>

  <div class="app-container">
    <div class="top-bar">
      <div class="badge-group">
        <div class="badge" id="progressBadge">題目 1 / 7</div>
        <div class="badge timer" id="timerDisplay">⏱️ 00:00.0</div>
        <div class="badge pb-badge" id="pbBadge">⭐ 最佳：--.- 秒</div>
        <div class="badge cloud-status cloud-local" id="cloudStatusBadge">💾 本機排行</div>
      </div>
      <div class="action-group">
        <button class="btn-restart-top" id="quickRestartBtn" title="重新計時挑戰">🔄 重來</button>
        <button class="btn-leaderboard" id="openLeaderboardBtn">🏆 排行榜</button>
      </div>
    </div>

    <div class="progress-track">
      <div class="progress-fill" id="progressFill"></div>
    </div>

    <div class="question-box" id="questionBox">
      <div class="question-label">請依序拼出英文單字（第一個字母需大寫）</div>
      <div class="chinese-word-row">
        <div class="chinese-word" id="chinesePrompt">星期一</div>
        <button class="btn-speak" id="speakBtn" title="聽發音">🔊 發音</button>
      </div>

      <div class="slots-wrapper" id="slotsContainer"></div>
    </div>

    <div class="feedback-bar feedback-info" id="feedbackBar">請點擊下方鍵盤開始拼字</div>

    <div class="keyboard" id="keyboard"></div>
  </div>

  <!-- 全部通關獎勵彈窗 -->
  <div class="modal-overlay" id="victoryModal">
    <div class="modal-card">
      <div class="trophy-icon" id="victoryIcon">🎉🏆🎉</div>
      <h2 class="modal-title" id="victoryTitle">太棒了！全部通關！</h2>
      <div class="final-time-box" id="finalTimeText">本次時間：00.0 秒</div>
      <div class="pb-compare-banner pb-new-record" id="pbCompareBanner">🔥 首次過關紀錄！</div>

      <div class="name-input-group" id="submitGroup">
        <input type="text" id="playerNameInput" class="name-input" placeholder="輸入班級座號或姓名..." maxlength="15" />
        <button class="btn-primary" id="saveScoreBtn">登錄排行</button>
      </div>
      <div id="submitStatusMsg" style="font-size: 0.85rem; color: #16a34a; font-weight: 700; min-height: 20px;"></div>

      <button class="btn-success-action" id="playAgainBtn" style="width: 100%; margin-top: 6px;">⚡ 再挑戰一次（打破紀錄）</button>
      <button class="btn-secondary" id="viewRankFromVictoryBtn" style="width: 100%;">🏆 查看英雄排行榜</button>
    </div>
  </div>

  <!-- 排行榜彈窗 -->
  <div class="modal-overlay" id="leaderboardModal">
    <div class="modal-card">
      <h2 class="modal-title">🏆 英雄排行榜</h2>
      <div id="rankSubtitle" style="font-size: 0.82rem; color: #64748b;">每人僅保留最佳成績（前 20 名）</div>
      <div class="rank-list" id="rankListContainer">
        <div style="text-align: center; padding: 30px; color: #94a3b8;">載入中...</div>
      </div>
      <button class="btn-success-action" id="playAgainFromRankBtn" style="width: 100%; margin-top: 4px;">⚡ 再挑戰一次（重新計時）</button>
      <button class="btn-secondary" id="closeLeaderboardBtn" style="width: 100%;">返回遊戲</button>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-app.js";
    import {
      getFirestore,
      collection,
      doc,
      getDoc,
      setDoc,
      query,
      orderBy,
      limit,
      onSnapshot
    } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-firestore.js";

    // =========================================================================
    // FIREBASE_CONFIG_START：請將您在 Firebase 控制台複製的設定貼在下方覆蓋
    // =========================================================================
    const firebaseConfig = {
      apiKey: "AIzaSyDmAO5RsDAXzrbAS1vcxVkGfWCeh-aIJ-A",
    authDomain: "weekday-spelling-game-31055.firebaseapp.com",
    projectId: "weekday-spelling-game-31055",
    storageBucket: "weekday-spelling-game-31055.firebasestorage.app",
    messagingSenderId: "402400078722",
    appId: "1:402400078722:web:6ddef8bad513bfff28fd9b"
    };
    // =========================================================================
    // FIREBASE_CONFIG_END
    // =========================================================================

    let db = null;
    let isCloudEnabled = false;
    let cloudRecords = [];
    const LOCAL_STORAGE_KEY = "weekday_spelling_leaderboard_v2";
    const PERSONAL_BEST_KEY = "weekday_spelling_personal_best";
    const LAST_PLAYER_NAME_KEY = "weekday_spelling_last_name";

    // 嘗試初始化 Firebase Firestore
    const cloudStatusBadge = document.getElementById("cloudStatusBadge");
    if (firebaseConfig.apiKey && firebaseConfig.apiKey !== "YOUR_API_KEY") {
      try {
        const app = initializeApp(firebaseConfig);
        db = getFirestore(app);
        isCloudEnabled = true;
        cloudStatusBadge.textContent = "☁️ 雲端即時排行";
        cloudStatusBadge.className = "badge cloud-status cloud-online";

        const q = query(
          collection(db, "leaderboard"),
          orderBy("time", "asc"),
          limit(20)
        );
        onSnapshot(
          q,
          (snapshot) => {
            cloudRecords = [];
            snapshot.forEach((docSnap) => {
              cloudRecords.push(docSnap.data());
            });
            renderLeaderboardList();
          },
          (err) => {
            console.warn("Firestore 讀取異常，切換為本機備援：", err);
            isCloudEnabled = false;
            cloudStatusBadge.textContent = "💾 本機排行";
            cloudStatusBadge.className = "badge cloud-status cloud-local";
          }
        );
      } catch (e) {
        console.warn("Firebase 初始化失敗，使用本機排行：", e);
      }
    }

    // 題庫資料
    const WORD_BANK = [
      { zh: "星期一", en: "Monday" },
      { zh: "星期二", en: "Tuesday" },
      { zh: "星期三", en: "Wednesday" },
      { zh: "星期四", en: "Thursday" },
      { zh: "星期五", en: "Friday" },
      { zh: "星期六", en: "Saturday" },
      { zh: "星期日", en: "Sunday" }
    ];

    const KEYBOARD_ROWS = [
      ["Q", "W", "E", "R", "T", "Y", "U", "I", "O", "P"],
      ["A", "S", "D", "F", "G", "H", "J", "K", "L"],
      ["SHIFT", "Z", "X", "C", "V", "B", "N", "M"]
    ];

    // 遊戲狀態變數
    let quizList = [];
    let currentIndex = 0;
    let typedLetters = [];
    let isUpperCase = true;
    let isLocked = false;
    let isGameFinished = false;
    let startTime = null;
    let timerInterval = null;
    let finalElapsedSeconds = 0;
    let hasSubmittedScore = false;

    // DOM 元素
    const progressBadge = document.getElementById("progressBadge");
    const timerDisplay = document.getElementById("timerDisplay");
    const pbBadge = document.getElementById("pbBadge");
    const progressFill = document.getElementById("progressFill");
    const chinesePrompt = document.getElementById("chinesePrompt");
    const slotsContainer = document.getElementById("slotsContainer");
    const feedbackBar = document.getElementById("feedbackBar");
    const keyboardEl = document.getElementById("keyboard");
    const questionBox = document.getElementById("questionBox");

    // 讀取並顯示本機個人最佳紀錄
    function getPersonalBest() {
      const val = localStorage.getItem(PERSONAL_BEST_KEY);
      return val ? Number(val) : null;
    }

    function updatePersonalBestDisplay() {
      const pb = getPersonalBest();
      pbBadge.textContent = pb !== null ? `⭐ 最佳：${pb.toFixed(1)} 秒` : "⭐ 最佳：--.- 秒";
    }

    // Web Audio API 音效合成器
    let audioCtx = null;
    function getAudioCtx() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === "suspended") {
        audioCtx.resume();
      }
      return audioCtx;
    }

    function playTone(freq, type, duration, delay = 0, volume = 0.18) {
      try {
        const ctx = getAudioCtx();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, ctx.currentTime + delay);
        gain.gain.setValueAtTime(volume, ctx.currentTime + delay);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + delay + duration);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(ctx.currentTime + delay);
        osc.stop(ctx.currentTime + delay + duration);
      } catch (e) {}
    }

    function playKeySound() {
      playTone(520, "sine", 0.08, 0, 0.12);
    }

    function playShiftSound() {
      playTone(380, "triangle", 0.07, 0, 0.1);
    }

    function playErrorSound() {
      playTone(180, "sawtooth", 0.18, 0, 0.2);
      playTone(140, "sawtooth", 0.22, 0.12, 0.2);
    }

    function playWordSuccessSound() {
      playTone(523.25, "sine", 0.14, 0, 0.18);
      playTone(659.25, "sine", 0.14, 0.1, 0.18);
      playTone(783.99, "sine", 0.28, 0.2, 0.2);
    }

    function playVictorySound() {
      const notes = [523.25, 659.25, 783.99, 1046.5, 783.99, 1046.5];
      const times = [0, 0.12, 0.24, 0.36, 0.54, 0.68];
      const durs = [0.12, 0.12, 0.12, 0.16, 0.12, 0.4];
      notes.forEach((n, idx) => playTone(n, "triangle", durs[idx], times[idx], 0.22));
    }

    // 語音朗讀
    function speakWord(text) {
      if ("speechSynthesis" in window) {
        window.speechSynthesis.cancel();
        const utter = new SpeechSynthesisUtterance(text);
        utter.lang = "en-US";
        utter.rate = 0.9;
        window.speechSynthesis.speak(utter);
      }
    }

    // 洗牌演算法
    function shuffleArray(arr) {
      const copy = [...arr];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    // 計時器控制
    function startTimer() {
      if (timerInterval) return;
      startTime = performance.now();
      timerInterval = setInterval(() => {
        const elapsed = (performance.now() - startTime) / 1000;
        timerDisplay.textContent = `⏱️ ${formatTime(elapsed)}`;
      }, 100);
    }

    function stopTimer() {
      if (timerInterval) {
        clearInterval(timerInterval);
        timerInterval = null;
      }
      if (startTime) {
        finalElapsedSeconds = Number(((performance.now() - startTime) / 1000).toFixed(1));
        timerDisplay.textContent = `⏱️ ${formatTime(finalElapsedSeconds)}`;
      }
    }

    function resetTimer() {
      if (timerInterval) {
        clearInterval(timerInterval);
        timerInterval = null;
      }
      startTime = null;
      finalElapsedSeconds = 0;
      timerDisplay.textContent = "⏱️ 00:00.0";
    }

    function formatTime(sec) {
      const mins = Math.floor(sec / 60);
      const remSec = (sec % 60).toFixed(1).padStart(4, "0");
      return `${String(mins).padStart(2, "0")}:${remSec}`;
    }

    // 繪製虛擬鍵盤
    function renderKeyboard() {
      keyboardEl.innerHTML = "";
      KEYBOARD_ROWS.forEach((row) => {
        const rowDiv = document.createElement("div");
        rowDiv.className = "kb-row";
        row.forEach((key) => {
          const btn = document.createElement("button");
          btn.type = "button";
          if (key === "SHIFT") {
            btn.className = `key-btn shift-btn ${isUpperCase ? "is-upper" : ""}`;
            btn.textContent = isUpperCase ? "⇧ 大寫" : "⇩ 小寫";
            btn.addEventListener("click", () => {
              playShiftSound();
              isUpperCase = !isUpperCase;
              renderKeyboard();
            });
          } else {
            const displayChar = isUpperCase ? key.toUpperCase() : key.toLowerCase();
            btn.className = "key-btn";
            btn.textContent = displayChar;
            btn.addEventListener("click", () => handleLetterInput(displayChar));
          }
          rowDiv.appendChild(btn);
        });
        keyboardEl.appendChild(rowDiv);
      });
    }

    // 繪製目前題目與拼字格
    function renderQuestion() {
      const currentWord = quizList[currentIndex];
      progressBadge.textContent = `題目 ${currentIndex + 1} / ${quizList.length}`;
      progressFill.style.width = `${(currentIndex / quizList.length) * 100}%`;
      chinesePrompt.textContent = currentWord.zh;

      slotsContainer.innerHTML = "";
      for (let i = 0; i < currentWord.en.length; i++) {
        const item = document.createElement("div");
        item.className = "slot-item";

        const hint = document.createElement("div");
        hint.className = i === 0 ? "cap-hint" : "cap-hint empty";
        hint.textContent = "大寫";

        const slot = document.createElement("div");
        slot.className = "letter-slot";
        if (i < typedLetters.length) {
          slot.textContent = typedLetters[i];
          slot.classList.add("filled");
        } else if (i === typedLetters.length) {
          slot.classList.add("active");
        }

        item.appendChild(hint);
        item.appendChild(slot);
        slotsContainer.appendChild(item);
      }
    }

    function setFeedback(msg, type = "info") {
      feedbackBar.textContent = msg;
      feedbackBar.className = `feedback-bar feedback-${type}`;
    }

    // 處理字母輸入
    function handleLetterInput(char) {
      if (isLocked || isGameFinished) return;
      if (!startTime) startTimer();

      const targetWord = quizList[currentIndex].en;
      const expectedChar = targetWord[typedLetters.length];

      if (char === expectedChar) {
        playKeySound();
        typedLetters.push(char);

        if (typedLetters.length === 1 && isUpperCase) {
          isUpperCase = false;
          renderKeyboard();
        }

        renderQuestion();

        if (typedLetters.length === targetWord.length) {
          isLocked = true;
          playWordSuccessSound();
          speakWord(targetWord);
          setFeedback(`✨ 答對了！${targetWord}`, "success");
          progressFill.style.width = `${((currentIndex + 1) / quizList.length) * 100}%`;

          setTimeout(() => {
            currentIndex++;
            if (currentIndex < quizList.length) {
              typedLetters = [];
              isUpperCase = true;
              isLocked = false;
              renderKeyboard();
              renderQuestion();
              setFeedback("繼續挑戰下一題！", "info");
            } else {
              handleAllCompleted();
            }
          }, 850);
        } else {
          setFeedback("很好！請繼續拼下一個字母", "info");
        }
      } else {
        isLocked = true;
        playErrorSound();

        const isCaseMismatch = char.toLowerCase() === expectedChar.toLowerCase();
        if (isCaseMismatch) {
          setFeedback(
            typedLetters.length === 0
              ? "❌ 第一個字母必須是大寫！請重新拼寫"
              : "❌ 後面的字母必須是小寫！請重新拼寫",
            "error"
          );
        } else {
          setFeedback(`❌ 拼錯囉（輸入了 ${char}），請從頭重新拼寫！`, "error");
        }

        const slots = slotsContainer.querySelectorAll(".letter-slot");
        if (slots[typedLetters.length]) {
          slots[typedLetters.length].textContent = char;
          slots[typedLetters.length].classList.add("error");
        }
        questionBox.classList.remove("shake");
        void questionBox.offsetWidth;
        questionBox.classList.add("shake");

        setTimeout(() => {
          typedLetters = [];
          isUpperCase = true;
          isLocked = false;
          renderKeyboard();
          renderQuestion();
        }, 650);
      }
    }

    // 全部通關
    function handleAllCompleted() {
      isGameFinished = true;
      stopTimer();
      playVictorySound();
      hasSubmittedScore = false;

      const prevPB = getPersonalBest();
      const bannerEl = document.getElementById("pbCompareBanner");
      const iconEl = document.getElementById("victoryIcon");
      const titleEl = document.getElementById("victoryTitle");

      if (prevPB === null) {
        localStorage.setItem(PERSONAL_BEST_KEY, String(finalElapsedSeconds));
        iconEl.textContent = "🎉🏆🎉";
        titleEl.textContent = "太棒了！首次通關！";
        bannerEl.className = "pb-compare-banner pb-new-record";
        bannerEl.textContent = `⭐ 已建立個人最佳紀錄：${finalElapsedSeconds.toFixed(1)} 秒`;
      } else if (finalElapsedSeconds < prevPB) {
        const diff = (prevPB - finalElapsedSeconds).toFixed(1);
        localStorage.setItem(PERSONAL_BEST_KEY, String(finalElapsedSeconds));
        iconEl.textContent = "🚀🔥🏆";
        titleEl.textContent = "刷新個人最佳紀錄！";
        bannerEl.className = "pb-compare-banner pb-new-record";
        bannerEl.textContent = `🔥 比原本最佳（${prevPB.toFixed(1)} 秒）快了 ${diff} 秒！`;
      } else if (finalElapsedSeconds === prevPB) {
        iconEl.textContent = "👏🏆👏";
        titleEl.textContent = "追平個人最佳紀錄！";
        bannerEl.className = "pb-compare-banner pb-try-again";
        bannerEl.textContent = `⚡ 與個人最佳（${prevPB.toFixed(1)} 秒）完全相同，再快一點就破紀錄了！`;
      } else {
        const diff = (finalElapsedSeconds - prevPB).toFixed(1);
        iconEl.textContent = "👍✨";
        titleEl.textContent = "完成挑戰！";
        bannerEl.className = "pb-compare-banner pb-try-again";
        bannerEl.textContent = `距離個人最佳（${prevPB.toFixed(1)} 秒）只差 ${diff} 秒，再試一次吧！`;
      }

      updatePersonalBestDisplay();

      document.getElementById("finalTimeText").textContent = `本次時間：${finalElapsedSeconds.toFixed(1)} 秒`;
      document.getElementById("playerNameInput").value = localStorage.getItem(LAST_PLAYER_NAME_KEY) || "";
      document.getElementById("saveScoreBtn").disabled = false;
      document.getElementById("saveScoreBtn").textContent = "登錄 / 更新排行";
      document.getElementById("submitStatusMsg").textContent = "";
      document.getElementById("victoryModal").classList.add("show");
    }

    // 將姓名轉成安全的 Firestore 文件 ID（同姓名只保留最快成績）
    function makePlayerDocId(name) {
      return encodeURIComponent(name.trim().toLowerCase()).replace(/%/g, "_");
    }

    // 儲存或更新最快成績（同姓名僅保留更短秒數）
    async function savePlayerScore() {
      if (hasSubmittedScore) return;
      const inputEl = document.getElementById("playerNameInput");
      const btnEl = document.getElementById("saveScoreBtn");
      const statusEl = document.getElementById("submitStatusMsg");
      const rawName = inputEl.value.trim();

      if (!rawName) {
        statusEl.style.color = "#dc2626";
        statusEl.textContent = "請先輸入姓名或座號喔！";
        inputEl.focus();
        return;
      }

      localStorage.setItem(LAST_PLAYER_NAME_KEY, rawName);
      hasSubmittedScore = true;
      btnEl.disabled = true;
      btnEl.textContent = "處理中...";

      // 1. 更新本機排行榜（同姓名只保留最快紀錄）
      const localList = getLocalLeaderboard();
      const existingIdx = localList.findIndex(
        (item) => item.name.trim().toLowerCase() === rawName.toLowerCase()
      );
      let isLocalFaster = true;
      if (existingIdx !== -1) {
        if (finalElapsedSeconds < localList[existingIdx].time) {
          localList[existingIdx].time = finalElapsedSeconds;
          localList[existingIdx].updatedAt = Date.now();
        } else {
          isLocalFaster = false;
        }
      } else {
        localList.push({
          name: rawName,
          time: finalElapsedSeconds,
          updatedAt: Date.now()
        });
      }
      localList.sort((a, b) => a.time - b.time);
      localStorage.setItem(LOCAL_STORAGE_KEY, JSON.stringify(localList.slice(0, 20)));

      // 2. 更新雲端 Firestore 排行榜（同姓名文件只覆蓋更短時間）
      if (isCloudEnabled && db) {
        try {
          const playerDocRef = doc(db, "leaderboard", makePlayerDocId(rawName));
          const existingDoc = await getDoc(playerDocRef);

          if (existingDoc.exists()) {
            const oldTime = Number(existingDoc.data().time);
            if (finalElapsedSeconds < oldTime) {
              await setDoc(playerDocRef, {
                name: rawName,
                time: finalElapsedSeconds,
                updatedAt: Date.now()
              });
              statusEl.style.color = "#16a34a";
              statusEl.textContent = `🔥 破紀錄！雲端榜已更新為 ${finalElapsedSeconds.toFixed(1)} 秒（原 ${oldTime.toFixed(1)} 秒）`;
              btnEl.textContent = "已更新";
            } else {
              statusEl.style.color = "#0284c7";
              statusEl.textContent = `☁️ 雲端榜已保留你更快的紀錄（${oldTime.toFixed(1)} 秒），繼續挑戰吧！`;
              btnEl.textContent = "已保留最佳";
            }
          } else {
            await setDoc(playerDocRef, {
              name: rawName,
              time: finalElapsedSeconds,
              updatedAt: Date.now()
            });
            statusEl.style.color = "#16a34a";
            statusEl.textContent = "☁️ 成績已成功登錄至全班雲端排行榜！";
            btnEl.textContent = "已登錄";
          }
        } catch (err) {
          console.error("雲端寫入失敗：", err);
          statusEl.style.color = "#d97706";
          statusEl.textContent = "⚠️ 雲端連線異常，已先儲存於本機排行榜";
          btnEl.textContent = "已存本機";
        }
      } else {
        if (isLocalFaster) {
          statusEl.style.color = "#16a34a";
          statusEl.textContent = "💾 本機排行榜已更新為你的最佳成績！";
        } else {
          statusEl.style.color = "#0284c7";
          statusEl.textContent = "💾 本機排行榜已保留你之前更快的成績！";
        }
        btnEl.textContent = "已登錄";
      }
    }

    function getLocalLeaderboard() {
      try {
        return JSON.parse(localStorage.getItem(LOCAL_STORAGE_KEY) || "[]");
      } catch (e) {
        return [];
      }
    }

    function renderLeaderboardList() {
      const container = document.getElementById("rankListContainer");
      const subtitle = document.getElementById("rankSubtitle");
      const list = isCloudEnabled ? cloudRecords : getLocalLeaderboard();

      subtitle.textContent = isCloudEnabled
        ? "☁️ 全班即時連線排行（每人僅保留最佳成績）"
        : "💾 本機裝置排行（每人僅保留最佳成績）";

      if (!list || list.length === 0) {
        container.innerHTML = `<div style="text-align:center; padding:36px 12px; color:#94a3b8; font-weight:600;">目前還沒有過關紀錄，快來搶下第一名！</div>`;
        return;
      }

      container.innerHTML = list
        .map((item, idx) => {
          let medal = `${idx + 1}.`;
          if (idx === 0) medal = "🥇";
          else if (idx === 1) medal = "🥈";
          else if (idx === 2) medal = "🥉";

          const safeName = escapeHtml(String(item.name || "匿名"));
          const timeVal = Number(item.time || 0).toFixed(1);

          return `
            <div class="rank-row">
              <div class="rank-left">
                <span class="rank-medal">${medal}</span>
                <span>${safeName}</span>
              </div>
              <span class="rank-time">${timeVal} 秒</span>
            </div>
          `;
        })
        .join("");
    }

    function escapeHtml(str) {
      return str
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    // 實體鍵盤支援
    document.addEventListener("keydown", (e) => {
      if (document.getElementById("victoryModal").classList.contains("show")) return;
      if (document.getElementById("leaderboardModal").classList.contains("show")) return;

      if (e.key === "Shift" || e.key === "CapsLock") {
        playShiftSound();
        isUpperCase = !isUpperCase;
        renderKeyboard();
        return;
      }

      if (/^[a-zA-Z]$/.test(e.key)) {
        e.preventDefault();
        handleLetterInput(e.key);
      }
    });

    // 按鈕事件綁定
    document.getElementById("speakBtn").addEventListener("click", () => {
      if (quizList[currentIndex]) {
        speakWord(quizList[currentIndex].en);
      }
    });

    document.getElementById("quickRestartBtn").addEventListener("click", () => {
      initGame();
    });

    document.getElementById("openLeaderboardBtn").addEventListener("click", () => {
      renderLeaderboardList();
      // 若已通關，調整按鈕文字讓學生一眼看懂
      document.getElementById("closeLeaderboardBtn").textContent = isGameFinished
        ? "返回通關畫面"
        : "繼續目前遊戲";
      document.getElementById("leaderboardModal").classList.add("show");
    });

    document.getElementById("closeLeaderboardBtn").addEventListener("click", () => {
      document.getElementById("leaderboardModal").classList.remove("show");
      // 如果是在全部通關狀態下看完排行榜，返回時重新開啟通關視窗，確保有「再挑戰一次」可按
      if (isGameFinished) {
        document.getElementById("victoryModal").classList.add("show");
      }
    });

    document.getElementById("playAgainFromRankBtn").addEventListener("click", () => {
      document.getElementById("leaderboardModal").classList.remove("show");
      document.getElementById("victoryModal").classList.remove("show");
      initGame();
    });

    document.getElementById("saveScoreBtn").addEventListener("click", savePlayerScore);

    document.getElementById("viewRankFromVictoryBtn").addEventListener("click", () => {
      document.getElementById("victoryModal").classList.remove("show");
      renderLeaderboardList();
      document.getElementById("closeLeaderboardBtn").textContent = "返回通關畫面";
      document.getElementById("leaderboardModal").classList.add("show");
    });

    document.getElementById("playAgainBtn").addEventListener("click", () => {
      document.getElementById("victoryModal").classList.remove("show");
      initGame();
    });

    // 啟動與重置遊戲
    function initGame() {
      quizList = shuffleArray(WORD_BANK);
      currentIndex = 0;
      typedLetters = [];
      isUpperCase = true;
      isLocked = false;
      isGameFinished = false;
      resetTimer();
      updatePersonalBestDisplay();
      renderKeyboard();
      renderQuestion();
      setFeedback("請點擊下方鍵盤開始拼字（按下第一個字開始計時）", "info");
    }

    initGame();
  </script>
</body>
</html>
